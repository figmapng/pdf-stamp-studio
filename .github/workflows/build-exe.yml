name: Build Windows Installer

on:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'installer/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies & Build Web App
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      # onedir (a folder, not a single file) starts instantly: nothing is unpacked on every launch
      - name: Compile desktop app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name "PdfStampStudio" `
            --icon "tools/desktop-app/app.ico" `
            --distpath build_out --workpath build_tmp `
            --add-data "dist;dist" `
            --add-data "tools/excel-stamp-addin;tools/excel-stamp-addin" `
            tools/desktop-app/PdfStampStudio.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\PdfStampStudio.iss
          if (!(Test-Path "release\PdfStampStudioSetup.exe")) { throw "Installer was not created" }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfStampStudioSetup-Windows
          path: release/PdfStampStudioSetup.exe

      - name: Remove old single-file exe from the release
        if: startsWith(github.ref, 'refs/heads/main')
        continue-on-error: true
        run: gh release delete-asset v1.0.0-addin PdfStampSetup.exe --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-addin
          name: "PDF Stamp Studio — программа для Windows и кнопка в Excel"
          body: |
            ## PDF Stamp Studio для Windows

            Скачайте **PdfStampStudioSetup.exe**, запустите и нажмите «Установить».
            Программа появится в меню «Пуск» и (по желанию) на рабочем столе; удалить её можно в «Параметры → Приложения».

            - Подпись и печать настраиваются один раз и сразу попадают в кнопку Excel
            - В программе: вкладка «Кнопка в Excel» → «Установить кнопку в Excel»
            - Работает без интернета; Word и Excel превращаются в PDF через установленный Microsoft Office
          files: release/PdfStampStudioSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
