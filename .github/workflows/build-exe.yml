name: Build Windows Exe

on:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies & Build Web App
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Compile Standalone Desktop App with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "PdfStampSetup" `
            --add-data "dist;dist" `
            --add-data "tools/excel-stamp-addin;tools/excel-stamp-addin" `
            tools/desktop-app/PdfStampStudio.py

      - name: Copy Exe to public/download
        run: |
          mkdir -p public/download
          cp dist/PdfStampSetup.exe public/download/PdfStampSetup.exe

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfStampSetup-Windows
          path: dist/PdfStampSetup.exe

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-addin
          name: "PDF Stamp Studio — Приложение для Windows и Надстройка Excel"
          body: |
            ## 🚀 PDF Stamp Studio — Программа для Windows (Дизайн как на сайте)
            
            Полноценное настольное приложение с современным дизайном веб-сайта:
            - Интерактивный предпросмотр и расстановка подписей и печати на листе протокола
            - Поддержка перетаскивания файлов Excel (.xlsx, .xls) и PDF
            - Предустановленные подписи (Инженер-химик Затыбек А. А., Заведующий лабораторией Сатыбалдина З. С.) и печать ТОО «Ecology Expert»
            - Полностью на русском языке
            - Встроенная кнопка установки надстройки в Excel (лента Ribbon, вкладка «Главная»)
            
            ### Скачать:
            Скачайте файл **PdfStampSetup.exe** и запустите его двойным щелчком.
          files: dist/PdfStampSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
